{% extends "!sphinx_material/layout.html" %}

{%- block extrahead %}
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="This is the documentation for NEST GPU, a GPU-MPI library for simulation of large-scale networks of spiking neurons.">
  <meta name="keywords" content="">
  {{ super() }}
{% endblock %}

<div role="main">
  {% block content %}
  <header id="header" class="wrapper clearfix">
    <div id="background">
     <div id="banner">
      <div id="logo">
        <img src="{{ pathto('_static/img/nestgpu-logo.png', 1) }}" alt="logo"/>
      </div>
    </div>
  </header>
 {{ super() }}
  {% endblock %}
{%- block footer %}

  <footer>
  {{ super() }}
  <div class="md-footer-meta md-typeset">
      <div class="md-footer-meta__inner md-grid" style="justify-content: center; padding-top: 0;">
        <div style="text-align: center; color: #666;">
          <a href="https://www.nest-initiative.org/impressum/" style="color: #666;">Impressum</a>
          <span style="margin: 0 0.5em;">|</span>
          <a href="https://www.nest-initiative.org/data-protection/" style="color: #666;">Data Protection</a>
        </div>
      </div>
    </div>
  </footer>
{% endblock %}
</div>
